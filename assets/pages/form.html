<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Tree of Sin - Contact US</title>

    <link rel="stylesheet" href="../css/style-form.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil:opsz,wght@10..72,100..900&family=Big+Shoulders:opsz,wght@10..72,100..900&family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=League+Gothic&family=Titillium+Web:ital,wght@0,200;0,300;0,400;0,600;0,700;0,900;1,200;1,300;1,400;1,600;1,700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>The Tree of Sin</h2>
            <h3>Contact Form</h3>
        </div>
        <form name="dados" id="dados" method="post">
            <div>
                <input type="text" name="" id="" placeholder="Your name" required>
            </div>
            <div>
                <input type="email" name="email" id="email" placeholder="Your email" required>
            </div>
            <div>
                <input type="tel" name="celular" id="celular" placeholder="Phone number" required>
            </div>
            <div>
                <textarea class="mensagem" id="mensagem" placeholder="Write here..."></textarea>
            </div>
            <div class="btn">
                <input type="submit" id="enviar" name="enviar" value="Enviar" maxlength="50">
            </div>
        </form>
    </div>
</body>
</html>
